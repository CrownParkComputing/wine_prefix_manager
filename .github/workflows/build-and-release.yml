name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., 1.9.1)'
        required: true
        default: ''

jobs:
  # Determine version first, to be used by all other jobs
  determine-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set_version.outputs.version }}
      display_version: ${{ steps.set_version.outputs.display_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set version
        id: set_version
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref_type }}" == "tag" ]]; then
            # Extract version from git tag
            DISPLAY_VERSION="${{ github.ref_name }}"
            # Version without v prefix for filenames
            FILE_VERSION="${DISPLAY_VERSION#v}"
            echo "Using version from Git tag: $DISPLAY_VERSION (file version: $FILE_VERSION)"
          else
            # Fallback to manual input or pubspec.yaml
            if [[ -n "${{ github.event.inputs.version }}" ]]; then
              FILE_VERSION="${{ github.event.inputs.version }}"
              DISPLAY_VERSION="v$FILE_VERSION"
              echo "Using version from workflow input: $DISPLAY_VERSION"
            else
              # Last resort - read from pubspec.yaml
              FILE_VERSION=$(grep 'version:' pubspec.yaml | awk '{print $2}' | tr -d "'\"" | cut -d'+' -f1)
              DISPLAY_VERSION="v$FILE_VERSION"
              echo "Using version from pubspec.yaml: $DISPLAY_VERSION"
            fi
          fi
          
          echo "FILE_VERSION=$FILE_VERSION"
          echo "DISPLAY_VERSION=$DISPLAY_VERSION"
          echo "version=$FILE_VERSION" >> $GITHUB_OUTPUT
          echo "display_version=$DISPLAY_VERSION" >> $GITHUB_OUTPUT
  
  build-linux:
    runs-on: ubuntu-latest
    needs: determine-version
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev fuse libfuse2
          sudo apt-get install -y dpkg-dev debhelper rpm librsvg2-bin
          sudo apt-get install -y libgtk-3-0 libgtk-3-common libgtk-3-dev libglib2.0-dev libgdk-pixbuf2.0-dev libcairo2-dev libpango1.0-dev libatk1.0-dev
          # Set PKG_CONFIG_PATH and verify GTK installation
          echo "PKG_CONFIG_PATH=/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig:\$PKG_CONFIG_PATH" >> $GITHUB_ENV
          export PKG_CONFIG_PATH="/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig:$PKG_CONFIG_PATH"
          echo "PKG_CONFIG_PATH: $PKG_CONFIG_PATH"
          pkg-config --exists gtk+-3.0 && echo "GTK+3.0 found" || echo "GTK+3.0 not found"
          pkg-config --modversion gtk+-3.0 || echo "Could not get GTK version"
          pkg-config --cflags gtk+-3.0 || echo "Could not get GTK cflags"
          pkg-config --libs gtk+-3.0 || echo "Could not get GTK libs"
          ls -la /usr/lib/x86_64-linux-gnu/pkgconfig/gtk*.pc || echo "No GTK pc files found"

      - name: Set version from global job
        id: version
        run: |
          VERSION="${{ needs.determine-version.outputs.version }}"
          DISPLAY_VERSION="${{ needs.determine-version.outputs.display_version }}"
          echo "Using consistent version: $DISPLAY_VERSION (file version: $VERSION)"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "DISPLAY_VERSION=$DISPLAY_VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "display_version=$DISPLAY_VERSION" >> $GITHUB_OUTPUT

      - name: Install Flutter dependencies
        run: |
          flutter clean
          flutter pub cache repair
          flutter pub get
        
      - name: Analyze project
        run: |
          # Create a temporary analysis options file to ignore plugin warnings
          cat > .analyze_temp_options.yaml << EOL
          include: package:flutter_lints/flutter.yaml
          
          analyzer:
            errors:
              invalid_use_of_internal_member: ignore
              missing_required_param: error
              missing_return: error
              must_be_immutable: warning
              sort_child_properties_last: ignore
              deprecated_member_use: ignore
              use_build_context_synchronously: ignore
              unnecessary_null_comparison: ignore
              unused_import: ignore
              unused_field: ignore
              unused_local_variable: ignore
              unused_element: ignore
              unnecessary_import: ignore
            exclude:
              - "**/*.g.dart"
              - "**/*.freezed.dart"
              - "lib/generated_plugin_registrant.dart"
          EOL
          
          # Run analyze with our temporary options file
          RESULT=0
          flutter analyze --fatal-infos --no-fatal-warnings --options=.analyze_temp_options.yaml || RESULT=$?
          
          # Check if there are any errors that aren't from file_picker
          flutter analyze --options=.analyze_temp_options.yaml 2>&1 | grep -v "file_picker" | grep -E "^error" > real_errors.txt || true
          
          if [ -s real_errors.txt ]; then
            echo "Critical errors found in your code that must be fixed before releasing:"
            cat real_errors.txt
            exit 1
          else
            if [ $RESULT -ne 0 ]; then
              echo "Only warnings detected, proceeding with build"
            else
              echo "No issues found, proceeding with build"
            fi
          fi
          
          # Clean up temp files
          rm -f .analyze_temp_options.yaml real_errors.txt

      - name: Build Linux application
        env:
          PKG_CONFIG_PATH: "/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig"
        run: |
          echo "PKG_CONFIG_PATH: $PKG_CONFIG_PATH"
          # Verify CMake can find GTK before building
          pkg-config --exists gtk+-3.0 && echo "GTK+3.0 still accessible" || echo "GTK+3.0 not accessible"
          flutter build linux --release

      - name: Create release directory
        run: |
          mkdir -p release/wine_prefix_manager-${{ steps.version.outputs.version }}-linux-x64-release
          cp -r build/linux/x64/release/bundle/* release/wine_prefix_manager-${{ steps.version.outputs.version }}-linux-x64-release/

      - name: Create tarball
        run: |
          cd release
          tar -czf wine_prefix_manager-${{ steps.version.outputs.version }}-linux-x64-release.tar.gz wine_prefix_manager-${{ steps.version.outputs.version }}-linux-x64-release
          sha256sum wine_prefix_manager-${{ steps.version.outputs.version }}-linux-x64-release.tar.gz > wine_prefix_manager-${{ steps.version.outputs.version }}-linux-x64-release.tar.gz.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: |
            release/*.tar.gz
            release/*.tar.gz.sha256
          retention-days: 3
          if-no-files-found: error

  build-deb:
    runs-on: ubuntu-latest
    needs: [determine-version, build-linux]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Linux build
        uses: actions/download-artifact@v4
        with:
          name: linux-build
          path: release/

      - name: Set version from global job
        id: version
        run: |
          VERSION="${{ needs.determine-version.outputs.version }}"
          DISPLAY_VERSION="${{ needs.determine-version.outputs.display_version }}"
          echo "Using consistent version: $DISPLAY_VERSION (file version: $VERSION)"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "DISPLAY_VERSION=$DISPLAY_VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "display_version=$DISPLAY_VERSION" >> $GITHUB_OUTPUT

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev debhelper

      - name: Extract tarball
        run: |
          cd release
          tar -xzf wine_prefix_manager-${{ steps.version.outputs.version }}-linux-x64-release.tar.gz

      - name: Create Debian package structure
        run: |
          # Ensure version doesn't contain any invalid characters
          CLEAN_VERSION=$(echo "${{ steps.version.outputs.version }}" | sed 's/[^0-9.]//g')
          echo "Clean version: $CLEAN_VERSION"
          
          DEB_NAME="wine-prefix-manager_${CLEAN_VERSION}-1_amd64"
          echo "Using Debian package name: $DEB_NAME"
          
          mkdir -p release/${DEB_NAME}/DEBIAN
          mkdir -p release/${DEB_NAME}/usr/bin
          mkdir -p release/${DEB_NAME}/usr/lib/wine_prefix_manager
          mkdir -p release/${DEB_NAME}/usr/share/applications
          mkdir -p release/${DEB_NAME}/usr/share/icons/hicolor/128x128/apps
          
          # Create control file
          cat > release/${DEB_NAME}/DEBIAN/control << EOF
          Package: wine-prefix-manager
          Version: $CLEAN_VERSION
          Section: utils
          Priority: optional
          Architecture: amd64
          Depends: wine
          Maintainer: Jon <jon@example.com>
          Description: Wine Prefix Manager
           A tool for managing Wine prefixes on Linux.
          EOF
          
          # Copy application files
          cp -r release/wine_prefix_manager-${{ steps.version.outputs.version }}-linux-x64-release/* release/${DEB_NAME}/usr/lib/wine_prefix_manager/
          
          # Create launcher script
          cat > release/${DEB_NAME}/usr/bin/wine_prefix_manager << EOF
          #!/bin/bash
          exec /usr/lib/wine_prefix_manager/wine_prefix_manager "\$@"
          EOF
          chmod +x release/${DEB_NAME}/usr/bin/wine_prefix_manager
          
          # Create desktop entry
          cat > release/${DEB_NAME}/usr/share/applications/wine_prefix_manager.desktop << EOF
          [Desktop Entry]
          Name=Wine Prefix Manager
          Comment=Manage Wine prefixes
          Exec=wine_prefix_manager
          Icon=wine_prefix_manager
          Terminal=false
          Type=Application
          Categories=Utility;
          EOF
          
          # Extract icon if it exists
          if [ -f "release/wine_prefix_manager-${{ steps.version.outputs.version }}-linux-x64-release/data/flutter_assets/assets/icon.png" ]; then
            cp release/wine_prefix_manager-${{ steps.version.outputs.version }}-linux-x64-release/data/flutter_assets/assets/icon.png release/${DEB_NAME}/usr/share/icons/hicolor/128x128/apps/wine_prefix_manager.png
          fi

      - name: Build Debian package
        run: |
          cd release
          # Ensure version doesn't contain any invalid characters
          CLEAN_VERSION=$(echo "${{ steps.version.outputs.version }}" | sed 's/[^0-9.]//g')
          DEB_NAME="wine-prefix-manager_${CLEAN_VERSION}-1_amd64"
          
          echo "Building Debian package: $DEB_NAME"
          dpkg-deb --build $DEB_NAME
          
          # Check if package was created successfully
          if [ -f "${DEB_NAME}.deb" ]; then
            echo "Debian package created successfully"
            sha256sum "${DEB_NAME}.deb" > "${DEB_NAME}.deb.sha256"
          else
            echo "ERROR: Failed to create Debian package"
            ls -la
            exit 1
          fi

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: wine-prefix-manager-deb
          path: |
            release/*.deb
            release/*.deb.sha256
          retention-days: 3
          if-no-files-found: warn

  build-rpm:
    runs-on: ubuntu-latest
    needs: [determine-version, build-linux]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Linux build
        uses: actions/download-artifact@v4
        with:
          name: linux-build
          path: release/

      - name: Set version from global job
        id: version
        run: |
          VERSION="${{ needs.determine-version.outputs.version }}"
          DISPLAY_VERSION="${{ needs.determine-version.outputs.display_version }}"
          echo "Using consistent version: $DISPLAY_VERSION (file version: $VERSION)"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "DISPLAY_VERSION=$DISPLAY_VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "display_version=$DISPLAY_VERSION" >> $GITHUB_OUTPUT

      - name: Install RPM build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Create RPM build directories
        run: |
          mkdir -p release/rpmbuild/{SOURCES,SPECS,BUILD,RPMS,SRPMS}
          cp release/wine_prefix_manager-${{ steps.version.outputs.version }}-linux-x64-release.tar.gz release/rpmbuild/SOURCES/

      - name: Create RPM spec file
        run: |
          cat > release/rpmbuild/SPECS/wine_prefix_manager.spec << EOF
          Name:           wine_prefix_manager
          Version:        ${{ steps.version.outputs.version }}
          Release:        1%{?dist}
          Summary:        Wine Prefix Manager
          License:        MIT
          URL:            https://github.com/jon/wine_prefix_manager
          Source0:        wine_prefix_manager-${{ steps.version.outputs.version }}-linux-x64-release.tar.gz
          BuildArch:      x86_64
          Requires:       wine
          
          %description
          A tool for managing Wine prefixes on Linux.
          
          %prep
          %setup -q -n wine_prefix_manager-${{ steps.version.outputs.version }}-linux-x64-release
          
          %build
          # Nothing to build
          
          %install
          mkdir -p %{buildroot}/usr/lib/wine_prefix_manager
          mkdir -p %{buildroot}/usr/bin
          mkdir -p %{buildroot}/usr/share/applications
          mkdir -p %{buildroot}/usr/share/icons/hicolor/128x128/apps
          
          # Copy application files
          cp -r * %{buildroot}/usr/lib/wine_prefix_manager/
          
          # Create launcher script
          cat > %{buildroot}/usr/bin/wine_prefix_manager << 'EOL'
          #!/bin/bash
          exec /usr/lib/wine_prefix_manager/wine_prefix_manager "\$@"
          EOL
          chmod +x %{buildroot}/usr/bin/wine_prefix_manager
          
          # Create desktop entry
          cat > %{buildroot}/usr/share/applications/wine_prefix_manager.desktop << EOL
          [Desktop Entry]
          Name=Wine Prefix Manager
          Comment=Manage Wine prefixes
          Exec=wine_prefix_manager
          Icon=wine_prefix_manager
          Terminal=false
          Type=Application
          Categories=Utility;
          EOL
          
          # Copy icon if it exists
          if [ -f "data/flutter_assets/assets/icon.png" ]; then
              cp data/flutter_assets/assets/icon.png %{buildroot}/usr/share/icons/hicolor/128x128/apps/wine_prefix_manager.png
          fi
          
          %files
          /usr/lib/wine_prefix_manager
          /usr/bin/wine_prefix_manager
          /usr/share/applications/wine_prefix_manager.desktop
          %if 0%{?fedora} || 0%{?rhel}
          /usr/share/icons/hicolor/128x128/apps/wine_prefix_manager.png
          %endif
          
          %changelog
          * $(date '+%a %b %d %Y') Jon <jon@example.com> - ${{ steps.version.outputs.version }}-1
          - Release ${{ steps.version.outputs.version }}
          EOF

      - name: Build RPM package
        run: |
          cd release
          rpmbuild --define "_topdir $(pwd)/rpmbuild" -bb rpmbuild/SPECS/wine_prefix_manager.spec
          
          # Find and move the RPM to the release directory
          find rpmbuild/RPMS -name "*.rpm" -exec cp {} . \;
          RPM_FILE=$(find . -maxdepth 1 -name "*.rpm" -printf "%f\n")
          sha256sum $RPM_FILE > $RPM_FILE.sha256

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: wine-prefix-manager-rpm
          path: |
            release/*.rpm
            release/*.rpm.sha256
          retention-days: 3
          if-no-files-found: warn

  build-appimage:
    runs-on: ubuntu-latest
    needs: [determine-version, build-linux]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Linux build
        uses: actions/download-artifact@v4
        with:
          name: linux-build
          path: release/
          
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.35.5'
      
      - name: Install Flutter dependencies
        run: |
          flutter pub get
          # Build a simple Flutter Linux app to ensure engine files are available
          mkdir -p /tmp/flutter-test
          cd /tmp/flutter-test
          flutter create --platforms=linux test_app
          cd test_app
          flutter build linux --release
          # Find where the Flutter libraries are located
          find . -name "libflutter_linux_gtk.so*"
          echo "Flutter libraries found at:"
          find $HOME/flutter -name "libflutter_linux_gtk.so*" || echo "Not found in flutter home"
          cd $GITHUB_WORKSPACE

      - name: Set version from global job
        id: version
        run: |
          VERSION="${{ needs.determine-version.outputs.version }}"
          DISPLAY_VERSION="${{ needs.determine-version.outputs.display_version }}"
          echo "Using consistent version: $DISPLAY_VERSION (file version: $VERSION)"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "DISPLAY_VERSION=$DISPLAY_VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "display_version=$DISPLAY_VERSION" >> $GITHUB_OUTPUT

      - name: Install AppImage tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 file patchelf
          
          # Download appimagetool directly (more reliable than linuxdeploy for this case)
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          
          # We'll skip linuxdeploy entirely and use appimagetool directly

      - name: Extract Linux build
        run: |
          cd release
          tar -xzf wine_prefix_manager-${{ steps.version.outputs.version }}-linux-x64-release.tar.gz

      - name: Prepare AppDir structure
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/lib/wine_prefix_manager
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/128x128/apps
          mkdir -p AppDir/usr/share/metainfo
          
          # Extract the Linux build
          cd release
          tar -xzf wine_prefix_manager-${{ steps.version.outputs.version }}-linux-x64-release.tar.gz
          cd ..
          
          # Copy application files
          cp -r release/wine_prefix_manager-${{ steps.version.outputs.version }}-linux-x64-release/* AppDir/usr/lib/wine_prefix_manager/
          
          # Find and include the Flutter library
          FLUTTER_PATH=$(which flutter)
          FLUTTER_DIR=$(dirname $(dirname $FLUTTER_PATH))
          echo "Looking for Flutter libraries in: $FLUTTER_DIR"
          
          # Create directory for Flutter libraries
          mkdir -p AppDir/usr/lib/
          
          # Copy Flutter library from the Flutter engine
          if [ -d "$FLUTTER_DIR/cache/artifacts/engine/linux-x64" ]; then
            echo "Found Flutter engine libraries"
            cp -L $FLUTTER_DIR/cache/artifacts/engine/linux-x64/lib*.so* AppDir/usr/lib/ || true
          fi
          
          # Also look in the system path for Flutter libraries
          find /usr/lib -name "libflutter_linux_gtk.so" -exec cp -L {} AppDir/usr/lib/ \; || true
          find /usr/local/lib -name "libflutter_linux_gtk.so" -exec cp -L {} AppDir/usr/lib/ \; || true
          
          # Print libraries in AppDir for debugging
          echo "Libraries in AppDir/usr/lib:"
          ls -la AppDir/usr/lib/ || true
          
          # Install Flutter dependencies and tools needed for AppImage
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0 libblkid1 liblzma5 libsecret-1-0 file patchelf
          
          # Extract Flutter libraries from the Flutter build
          echo "Extracting and collecting Flutter libraries..."
          mkdir -p AppDir/usr/lib
          
          # Copy all the libraries from the bundle to usr/lib
          cp -L release/wine_prefix_manager-${{ steps.version.outputs.version }}-linux-x64-release/lib/*.so* AppDir/usr/lib/ || true
          
          # Try to find libflutter_linux_gtk.so from various locations
          find /usr -name "libflutter_linux_gtk.so*" 2>/dev/null | while read -r lib; do
            echo "Found Flutter library: $lib"
            cp -L "$lib" AppDir/usr/lib/ || true
          done
          
          # Install Flutter from source if needed
          if [ ! -f "AppDir/usr/lib/libflutter_linux_gtk.so" ]; then
            echo "Flutter library not found in system, building minimal version..."
            git clone --depth 1 https://github.com/flutter/flutter.git flutter-source
            cd flutter-source
            ./bin/flutter doctor
            cd ..
            
            # Try to find it in the flutter installation
            find flutter-source -name "libflutter_linux_gtk.so*" 2>/dev/null | while read -r lib; do
              echo "Found Flutter library in Flutter source: $lib"
              cp -L "$lib" AppDir/usr/lib/ || true
            done
          fi
          
          # Create launcher script
          cat > AppDir/usr/bin/wine_prefix_manager << EOF
          #!/bin/bash
          exec /usr/lib/wine_prefix_manager/wine_prefix_manager "\$@"
          EOF
          chmod +x AppDir/usr/bin/wine_prefix_manager
          
          # Create desktop entry
          cat > AppDir/usr/share/applications/wine_prefix_manager.desktop << EOF
          [Desktop Entry]
          Name=Wine Prefix Manager
          Comment=Manage Wine prefixes
          Exec=wine_prefix_manager
          Icon=wine_prefix_manager
          Terminal=false
          Type=Application
          Categories=Utility;
          EOF
          
          # Copy icon if it exists
          if [ -f "release/wine_prefix_manager-${{ steps.version.outputs.version }}-linux-x64-release/data/flutter_assets/assets/icon.png" ]; then
            mkdir -p AppDir/usr/share/icons/hicolor/128x128/apps/
            cp release/wine_prefix_manager-${{ steps.version.outputs.version }}-linux-x64-release/data/flutter_assets/assets/icon.png AppDir/usr/share/icons/hicolor/128x128/apps/wine_prefix_manager.png
          fi
          
          # Create appdata file
          cat > AppDir/usr/share/metainfo/wine_prefix_manager.appdata.xml << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <component type="desktop-application">
            <id>wine_prefix_manager</id>
            <name>Wine Prefix Manager</name>
            <summary>Manage Wine prefixes on Linux</summary>
            <description>
              <p>A user-friendly tool for managing Wine and Proton prefixes on Linux.</p>
            </description>
            <url type="homepage">https://github.com/jon/wine_prefix_manager</url>
            <launchable type="desktop-id">wine_prefix_manager.desktop</launchable>
            <releases>
              <release version="${{ steps.version.outputs.version }}" date="$(date '+%Y-%m-%d')"/>
            </releases>
          </component>
          EOF

      - name: Create AppImage (with fallback methods)
        run: |
          set +e  # Allow commands to fail
          
          # Download AppImageTool
          if [ ! -f appimagetool ]; then
            echo "Downloading appimagetool..."
            wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
            chmod +x appimagetool
          fi
          
          # Set up AppImage environment variables
          export ARCH="x86_64"
          export VERSION="${{ steps.version.outputs.version }}"
          APPIMAGE_NAME="wine_prefix_manager-${{ steps.version.outputs.version }}-x86_64.AppImage"
          
          # Create AppDir
          mkdir -p AppDir/usr/bin AppDir/usr/lib/wine_prefix_manager AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/128x128/apps
          
          # Copy the application files
          cp -r release/wine_prefix_manager-${{ steps.version.outputs.version }}-linux-x64-release/* AppDir/usr/lib/wine_prefix_manager/
          
          # Create a simple AppRun script
          cat > AppDir/AppRun << 'EOF'
          #!/bin/bash
          SELF=$(readlink -f "$0")
          HERE=${SELF%/*}
          export LD_LIBRARY_PATH="${HERE}/usr/lib:${LD_LIBRARY_PATH}"
          exec "${HERE}/usr/lib/wine_prefix_manager/wine_prefix_manager" "$@"
          EOF
          chmod +x AppDir/AppRun
          
          # Create desktop file
          cat > AppDir/usr/share/applications/wine_prefix_manager.desktop << 'EOF'
          [Desktop Entry]
          Name=Wine Prefix Manager
          Comment=Manage Wine prefixes
          Exec=wine_prefix_manager
          Icon=wine_prefix_manager
          Terminal=false
          Type=Application
          Categories=Utility;
          EOF
          
          # Copy or create icon
          if [ -f "release/wine_prefix_manager-${{ steps.version.outputs.version }}-linux-x64-release/data/flutter_assets/assets/icon.png" ]; then
            cp release/wine_prefix_manager-${{ steps.version.outputs.version }}-linux-x64-release/data/flutter_assets/assets/icon.png AppDir/usr/share/icons/hicolor/128x128/apps/wine_prefix_manager.png
          else
            # Create a placeholder icon using ImageMagick if available
            if command -v convert > /dev/null 2>&1; then
              convert -size 128x128 xc:lightblue -pointsize 24 -fill black -gravity center -annotate 0 "WPM" AppDir/usr/share/icons/hicolor/128x128/apps/wine_prefix_manager.png
            else
              # Fallback approach if ImageMagick fails
              if [ ! -f "AppDir/wine_prefix_manager.png" ]; then
                echo "Creating a simple PNG file manually"
                # Create a simple 16x16 colored box as PNG using hex data
                printf '\x89\x50\x4E\x47\x0D\x0A\x1A\x0A\x00\x00\x00\x0D\x49\x48\x44\x52\x00\x00\x00\x10\x00\x00\x00\x10\x08\x02\x00\x00\x00\x90\x91\x68\x36\x00\x00\x00\x01\x73\x52\x47\x42\x00\xAE\xCE\x1C\xE9\x00\x00\x00\x30\x49\x44\x41\x54\x38\x11\x63\xF8\x0F\x05\x0C\x0C\x0C\x0C\x44\x00\xA2\x4C\x46\x35\x60\x34\x0C\x46\xC3\x60\x34\x0C\x46\xC3\x60\x34\x0C\x46\xC3\x60\x34\x0C\x46\xC3\x00\x1D\x06\x00\x24\xE5\x04\x88\xFF\xFF\xFF\xFF\x00\x00\x00\x00\x49\x45\x4E\x44\xAE\x42\x60\x82' > AppDir/usr/share/icons/hicolor/128x128/apps/wine_prefix_manager.png
              fi
            fi
          fi
          
          # Copy icon to the root of AppDir (required by appimagetool)
          cp AppDir/usr/share/icons/hicolor/128x128/apps/wine_prefix_manager.png AppDir/wine_prefix_manager.png
          ln -s usr/share/applications/wine_prefix_manager.desktop AppDir/wine_prefix_manager.desktop
          
          # Try building AppImage with basic approach
          export APPIMAGE_EXTRACT_AND_RUN=1
          ./appimagetool AppDir "$APPIMAGE_NAME"
          RESULT=$?
          
          if [ $RESULT -ne 0 ]; then
            echo "Basic AppImage creation failed, trying alternative approach..."
            
            # Try building again with minimal approach and disable strip
            export NO_STRIP=1
            ./appimagetool AppDir "$APPIMAGE_NAME"
            RESULT=$?
          fi
          
          # If everything else fails, try the direct approach with environment variables
          if [ $RESULT -ne 0 ]; then
            echo "Trying one last approach with direct environment variables..."
            # Use environment variables to make appimagetool work without FUSE
            export ARCH="x86_64"
            export VERSION="${{ steps.version.outputs.version }}"
            export APPIMAGE_EXTRACT_AND_RUN=1
            export NO_STRIP=1
            
            # If nothing else works, create a self-extracting AppImage manually
            if [ $RESULT -ne 0 ]; then
              echo "Creating self-extracting AppImage manually..."
              
              # Create a clean AppDir with minimal dependencies
              rm -rf AppDir
              mkdir -p AppDir/usr/bin AppDir/usr/lib/wine_prefix_manager AppDir/usr/share/applications
              
              # Copy only the essential files
              cp -r release/wine_prefix_manager-${{ steps.version.outputs.version }}-linux-x64-release/* AppDir/usr/lib/wine_prefix_manager/
              
              # Create a simple AppRun that sets up everything
              cat > AppDir/AppRun << 'EOF'
              #!/bin/bash
              SELF=$(readlink -f "$0")
              HERE=${SELF%/*}
              
              # Set up environment
              export LD_LIBRARY_PATH="${HERE}/usr/lib:${HERE}/usr/lib/wine_prefix_manager/lib:${LD_LIBRARY_PATH}"
              export PATH="${HERE}/usr/bin:${PATH}"
              export XDG_DATA_DIRS="${HERE}/usr/share:${XDG_DATA_DIRS:-/usr/local/share:/usr/share}"
              export FONTCONFIG_PATH="${HERE}/etc/fonts"
              export GSETTINGS_SCHEMA_DIR="${HERE}/usr/share/glib-2.0/schemas"
              
              # Run the application
              exec "${HERE}/usr/lib/wine_prefix_manager/wine_prefix_manager" "$@"
              EOF
              chmod +x AppDir/AppRun
              
              # Create necessary desktop file and icon
              cp -f release/wine_prefix_manager-${{ steps.version.outputs.version }}-linux-x64-release/data/flutter_assets/assets/icon.png AppDir/ || true
              
              # If icon extraction failed, create a placeholder icon
              if [ ! -f "AppDir/icon.png" ]; then
                printf '\x89\x50\x4E\x47\x0D\x0A\x1A\x0A\x00\x00\x00\x0D\x49\x48\x44\x52\x00\x00\x00\x20\x00\x00\x00\x20\x08\x02\x00\x00\x00\xFC\x18\xED\xA3\x00\x00\x00\x01\x73\x52\x47\x42\x00\xAE\xCE\x1C\xE9\x00\x00\x00\x30\x49\x44\x41\x54\x48\x89\xED\x96\x31\x0A\x00\x20\x0C\xC3\x34\xFF\xFD\xBC\x16\x41\x10\x14\x77\xC9\x98\x0D\xA9\xC5\x9E\x99\x5B\xB5\x67\xF6\x13\x58\x23\xC0\x95\x0D\x24\x6D\xDF\x3E\xE5\xE7\x02\x19\x54\x7C\x3A\x52\x68\xA5\x02\x00\x00\x00\x00\x49\x45\x4E\x44\xAE\x42\x60\x82' > AppDir/wine_prefix_manager.png
              fi
              
              cat > AppDir/wine_prefix_manager.desktop << 'EOF'
              [Desktop Entry]
              Name=Wine Prefix Manager
              Comment=Manage Wine prefixes
              Exec=wine_prefix_manager
              Icon=wine_prefix_manager
              Terminal=false
              Type=Application
              Categories=Utility;
              EOF
              
              # Try using appimagetool one last time with most permissive options
              export APPIMAGE_EXTRACT_AND_RUN=1
              export NO_STRIP=1
              ./appimagetool --comp gzip AppDir "$APPIMAGE_NAME"
              RESULT=$?
            fi
          fi
          
          set -e
          
          # Check if AppImage was created successfully
          if [ -f "$APPIMAGE_NAME" ]; then
            echo "Found AppImage: $APPIMAGE_NAME"
            
            # Move AppImage to release directory
            cp "$APPIMAGE_NAME" release/
            
            # Create checksum
            cd release
            sha256sum "$APPIMAGE_NAME" > "$APPIMAGE_NAME.sha256"
            cd ..
            
            echo "AppImage created successfully"
          else
            echo "All AppImage creation methods failed, creating a tarball-based alternative"
            
            # Create an alternative distribution method as .run file
            cd release
            tar czf wine_prefix_manager-${{ steps.version.outputs.version }}-x86_64.tar.gz wine_prefix_manager-${{ steps.version.outputs.version }}-linux-x64-release

            # Create a self-extracting installer
            cat > "wine_prefix_manager-${{ steps.version.outputs.version }}-x86_64.AppImage" << 'EOF'
            #!/bin/bash
            # Self-extracting installer for Wine Prefix Manager
            SELF=$(readlink -f "$0")
            TMPDIR=$(mktemp -d)
            ARCHIVE=$(awk '/^__ARCHIVE_BELOW__/ {print NR + 1; exit 0; }' "$SELF")
            tail -n+$ARCHIVE "$SELF" | tar xzf - -C "$TMPDIR"
            cd "$TMPDIR"
            "$TMPDIR"/wine_prefix_manager-*/wine_prefix_manager
            rm -rf "$TMPDIR"
            exit 0
            __ARCHIVE_BELOW__
            EOF
            cat wine_prefix_manager-${{ steps.version.outputs.version }}-x86_64.tar.gz >> "wine_prefix_manager-${{ steps.version.outputs.version }}-x86_64.AppImage"
            chmod +x "wine_prefix_manager-${{ steps.version.outputs.version }}-x86_64.AppImage"
            
            sha256sum "wine_prefix_manager-${{ steps.version.outputs.version }}-x86_64.AppImage" > "wine_prefix_manager-${{ steps.version.outputs.version }}-x86_64.AppImage.sha256"
            cd ..
            
            echo "Created alternative AppImage-like self-extracting installer"
          fi

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: wine-prefix-manager-appimage
          path: |
            release/*.AppImage
            release/*.AppImage.sha256
          retention-days: 3
          if-no-files-found: warn

  create-release:
    runs-on: ubuntu-latest
    needs: [determine-version, build-linux, build-deb, build-rpm, build-appimage]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for proper release notes generation

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create release directory
        run: mkdir -p release/

      - name: Copy artifacts to release directory
        run: |
          echo "Listing all downloaded artifacts:"
          find artifacts -type f | sort
          
          echo "Copying linux-build artifacts..."
          mkdir -p release/
          cp -v artifacts/linux-build/* release/ || echo "Warning: Some linux-build artifacts may not have been copied"
          
          echo "Copying DEB artifacts..."
          cp -v artifacts/wine-prefix-manager-deb/* release/ || echo "Warning: Some DEB artifacts may not have been copied"
          
          echo "Copying RPM artifacts..."
          cp -v artifacts/wine-prefix-manager-rpm/* release/ || echo "Warning: Some RPM artifacts may not have been copied"
          
          echo "Copying AppImage artifacts..."
          cp -v artifacts/wine-prefix-manager-appimage/* release/ || echo "Warning: Some AppImage artifacts may not have been copied"
          
          echo "Final release contents:"
          ls -la release/

      - name: Set version from global job
        id: get_release_version
        run: |
          # Use version determined by the global job
          VERSION="${{ needs.determine-version.outputs.version }}"
          DISPLAY_VERSION="${{ needs.determine-version.outputs.display_version }}"
          
          echo "Using consistent version from global job: $DISPLAY_VERSION (file version: $VERSION)"
          
          echo "DISPLAY_VERSION=$DISPLAY_VERSION" >> $GITHUB_ENV
          echo "FILE_VERSION=$VERSION" >> $GITHUB_ENV
          echo "display_version=$DISPLAY_VERSION" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      
      - name: Generate release notes
        id: release_notes
        run: |
          # Use the display version with v prefix for the release notes title
          DISPLAY_VERSION="${{ needs.determine-version.outputs.display_version }}"
          
          # Log for debugging purposes
          echo "Creating release notes with version: $DISPLAY_VERSION"
          
          # Try to get detailed release notes from commit history
          COMMITS=$(git log --pretty=format:"* %s (%h)" $(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo HEAD~10)..HEAD)
          
          # Add a fallback if no commits found
          if [ -z "$COMMITS" ]; then
            COMMITS="* Bug fixes and improvements"
          fi
          
          # Create release notes with version and commits
          cat > release_notes.md << 'EOF'
          # Wine Prefix Manager ${DISPLAY_VERSION}
          
          Released on $(date '+%Y-%m-%d')
          
          ## Changes in this version:
          
          ${COMMITS}
          
          ## Download Options
          
          * **Debian/Ubuntu**: Download the .deb file
          * **RPM-based distros**: Download the .rpm file
          * **Other Linux distros**: Download the AppImage file
          * **Source code**: Download the .tar.gz file
          EOF
          
          # Replace variables in the file
          sed -i "s/\${DISPLAY_VERSION}/$DISPLAY_VERSION/g" release_notes.md
          sed -i "s/\$(date '+%Y-%m-%d')/$(date '+%Y-%m-%d')/g" release_notes.md
          sed -i "s|\${COMMITS}|$COMMITS|g" release_notes.md
          
          # Display release notes for debugging
          echo "Generated release notes:"
          cat release_notes.md
          
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: "Wine Prefix Manager ${{ needs.determine-version.outputs.display_version }}"
          body_path: release_notes.md
          tag_name: ${{ github.ref }} # Use the existing tag reference
          files: |
            release/*.tar.gz
            release/*.tar.gz.sha256
            release/*.deb
            release/*.deb.sha256
            release/*.rpm
            release/*.rpm.sha256
            release/*.AppImage
            release/*.AppImage.sha256
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
