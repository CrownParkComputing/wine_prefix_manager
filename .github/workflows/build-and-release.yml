name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., 1.9.1)'
        required: true
        default: ''

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.x'

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev fuse libfuse2
          sudo apt-get install -y dpkg-dev debhelper rpm librsvg2-bin

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Install Flutter dependencies
        run: flutter pub get
        
      - name: Analyze project
        run: |
          # Run analyze and capture the output
          flutter analyze > analyze_output.txt 2>&1 || true
          
          # Check for critical errors but ignore file_picker plugin warnings
          if grep -q "error" analyze_output.txt && grep -v file_picker analyze_output.txt | grep -q "error"; then
            echo "Critical errors found in code that must be fixed before releasing:"
            grep "error" analyze_output.txt | grep -v file_picker || true
            exit 1
          else
            echo "No critical errors found, proceeding with build"
          fi

      - name: Build Linux application
        run: flutter build linux --release

      - name: Create release directory
        run: |
          mkdir -p release/wine_prefix_manager-${{ steps.version.outputs.version }}-linux-x64-release
          cp -r build/linux/x64/release/bundle/* release/wine_prefix_manager-${{ steps.version.outputs.version }}-linux-x64-release/

      - name: Create tarball
        run: |
          cd release
          tar -czf wine_prefix_manager-${{ steps.version.outputs.version }}-linux-x64-release.tar.gz wine_prefix_manager-${{ steps.version.outputs.version }}-linux-x64-release
          sha256sum wine_prefix_manager-${{ steps.version.outputs.version }}-linux-x64-release.tar.gz > wine_prefix_manager-${{ steps.version.outputs.version }}-linux-x64-release.tar.gz.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: |
            release/*.tar.gz
            release/*.sha256
          retention-days: 3

  build-deb:
    runs-on: ubuntu-latest
    needs: build-linux
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Linux build
        uses: actions/download-artifact@v4
        with:
          name: linux-build
          path: release/

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev debhelper

      - name: Extract tarball
        run: |
          cd release
          tar -xzf wine_prefix_manager-${{ steps.version.outputs.version }}-linux-x64-release.tar.gz

      - name: Create Debian package structure
        run: |
          DEB_NAME="wine_prefix_manager_${{ steps.version.outputs.version }}-1_amd64"
          mkdir -p release/${DEB_NAME}/DEBIAN
          mkdir -p release/${DEB_NAME}/usr/bin
          mkdir -p release/${DEB_NAME}/usr/lib/wine_prefix_manager
          mkdir -p release/${DEB_NAME}/usr/share/applications
          mkdir -p release/${DEB_NAME}/usr/share/icons/hicolor/128x128/apps
          
          # Create control file
          cat > release/${DEB_NAME}/DEBIAN/control << EOF
          Package: wine_prefix_manager
          Version: ${{ steps.version.outputs.version }}
          Section: utils
          Priority: optional
          Architecture: amd64
          Depends: wine
          Maintainer: Jon <jon@example.com>
          Description: Wine Prefix Manager
           A tool for managing Wine prefixes on Linux.
          EOF
          
          # Copy application files
          cp -r release/wine_prefix_manager-${{ steps.version.outputs.version }}-linux-x64-release/* release/${DEB_NAME}/usr/lib/wine_prefix_manager/
          
          # Create launcher script
          cat > release/${DEB_NAME}/usr/bin/wine_prefix_manager << EOF
          #!/bin/bash
          exec /usr/lib/wine_prefix_manager/wine_prefix_manager "\$@"
          EOF
          chmod +x release/${DEB_NAME}/usr/bin/wine_prefix_manager
          
          # Create desktop entry
          cat > release/${DEB_NAME}/usr/share/applications/wine_prefix_manager.desktop << EOF
          [Desktop Entry]
          Name=Wine Prefix Manager
          Comment=Manage Wine prefixes
          Exec=wine_prefix_manager
          Icon=wine_prefix_manager
          Terminal=false
          Type=Application
          Categories=Utility;
          EOF
          
          # Extract icon if it exists
          if [ -f "release/wine_prefix_manager-${{ steps.version.outputs.version }}-linux-x64-release/data/flutter_assets/assets/icon.png" ]; then
            cp release/wine_prefix_manager-${{ steps.version.outputs.version }}-linux-x64-release/data/flutter_assets/assets/icon.png release/${DEB_NAME}/usr/share/icons/hicolor/128x128/apps/wine_prefix_manager.png
          fi

      - name: Build Debian package
        run: |
          cd release
          dpkg-deb --build wine_prefix_manager_${{ steps.version.outputs.version }}-1_amd64
          sha256sum wine_prefix_manager_${{ steps.version.outputs.version }}-1_amd64.deb > wine_prefix_manager_${{ steps.version.outputs.version }}-1_amd64.deb.sha256

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: wine-prefix-manager-deb
          path: |
            release/*.deb
            release/*.deb.sha256
          retention-days: 3

  build-rpm:
    runs-on: ubuntu-latest
    needs: build-linux
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Linux build
        uses: actions/download-artifact@v4
        with:
          name: linux-build
          path: release/

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Install RPM build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Create RPM build directories
        run: |
          mkdir -p release/rpmbuild/{SOURCES,SPECS,BUILD,RPMS,SRPMS}
          cp release/wine_prefix_manager-${{ steps.version.outputs.version }}-linux-x64-release.tar.gz release/rpmbuild/SOURCES/

      - name: Create RPM spec file
        run: |
          cat > release/rpmbuild/SPECS/wine_prefix_manager.spec << EOF
          Name:           wine_prefix_manager
          Version:        ${{ steps.version.outputs.version }}
          Release:        1%{?dist}
          Summary:        Wine Prefix Manager
          License:        MIT
          URL:            https://github.com/jon/wine_prefix_manager
          Source0:        wine_prefix_manager-${{ steps.version.outputs.version }}-linux-x64-release.tar.gz
          BuildArch:      x86_64
          Requires:       wine
          
          %description
          A tool for managing Wine prefixes on Linux.
          
          %prep
          %setup -q -n wine_prefix_manager-${{ steps.version.outputs.version }}-linux-x64-release
          
          %build
          # Nothing to build
          
          %install
          mkdir -p %{buildroot}/usr/lib/wine_prefix_manager
          mkdir -p %{buildroot}/usr/bin
          mkdir -p %{buildroot}/usr/share/applications
          mkdir -p %{buildroot}/usr/share/icons/hicolor/128x128/apps
          
          # Copy application files
          cp -r * %{buildroot}/usr/lib/wine_prefix_manager/
          
          # Create launcher script
          cat > %{buildroot}/usr/bin/wine_prefix_manager << 'EOL'
          #!/bin/bash
          exec /usr/lib/wine_prefix_manager/wine_prefix_manager "\$@"
          EOL
          chmod +x %{buildroot}/usr/bin/wine_prefix_manager
          
          # Create desktop entry
          cat > %{buildroot}/usr/share/applications/wine_prefix_manager.desktop << EOL
          [Desktop Entry]
          Name=Wine Prefix Manager
          Comment=Manage Wine prefixes
          Exec=wine_prefix_manager
          Icon=wine_prefix_manager
          Terminal=false
          Type=Application
          Categories=Utility;
          EOL
          
          # Copy icon if it exists
          if [ -f "data/flutter_assets/assets/icon.png" ]; then
              cp data/flutter_assets/assets/icon.png %{buildroot}/usr/share/icons/hicolor/128x128/apps/wine_prefix_manager.png
          fi
          
          %files
          /usr/lib/wine_prefix_manager
          /usr/bin/wine_prefix_manager
          /usr/share/applications/wine_prefix_manager.desktop
          %if 0%{?fedora} || 0%{?rhel}
          /usr/share/icons/hicolor/128x128/apps/wine_prefix_manager.png
          %endif
          
          %changelog
          * $(date '+%a %b %d %Y') Jon <jon@example.com> - ${{ steps.version.outputs.version }}-1
          - Release ${{ steps.version.outputs.version }}
          EOF

      - name: Build RPM package
        run: |
          cd release
          rpmbuild --define "_topdir $(pwd)/rpmbuild" -bb rpmbuild/SPECS/wine_prefix_manager.spec
          
          # Find and move the RPM to the release directory
          find rpmbuild/RPMS -name "*.rpm" -exec cp {} . \;
          RPM_FILE=$(find . -maxdepth 1 -name "*.rpm" -printf "%f\n")
          sha256sum $RPM_FILE > $RPM_FILE.sha256

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: wine-prefix-manager-rpm
          path: |
            release/*.rpm
            release/*.rpm.sha256
          retention-days: 3

  build-appimage:
    runs-on: ubuntu-latest
    needs: build-linux
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Linux build
        uses: actions/download-artifact@v4
        with:
          name: linux-build
          path: release/

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Install AppImage tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2
          wget -O linuxdeploy-x86_64.AppImage https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage

      - name: Extract Linux build
        run: |
          cd release
          tar -xzf wine_prefix_manager-${{ steps.version.outputs.version }}-linux-x64-release.tar.gz

      - name: Prepare AppDir structure
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/lib/wine_prefix_manager
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/128x128/apps
          mkdir -p AppDir/usr/share/metainfo
          
          # Copy application files
          cp -r release/wine_prefix_manager-${{ steps.version.outputs.version }}-linux-x64-release/* AppDir/usr/lib/wine_prefix_manager/
          
          # Create launcher script
          cat > AppDir/usr/bin/wine_prefix_manager << EOF
          #!/bin/bash
          exec /usr/lib/wine_prefix_manager/wine_prefix_manager "\$@"
          EOF
          chmod +x AppDir/usr/bin/wine_prefix_manager
          
          # Create desktop entry
          cat > AppDir/usr/share/applications/wine_prefix_manager.desktop << EOF
          [Desktop Entry]
          Name=Wine Prefix Manager
          Comment=Manage Wine prefixes
          Exec=wine_prefix_manager
          Icon=wine_prefix_manager
          Terminal=false
          Type=Application
          Categories=Utility;
          EOF
          
          # Copy icon if it exists
          if [ -f "release/wine_prefix_manager-${{ steps.version.outputs.version }}-linux-x64-release/data/flutter_assets/assets/icon.png" ]; then
            mkdir -p AppDir/usr/share/icons/hicolor/128x128/apps/
            cp release/wine_prefix_manager-${{ steps.version.outputs.version }}-linux-x64-release/data/flutter_assets/assets/icon.png AppDir/usr/share/icons/hicolor/128x128/apps/wine_prefix_manager.png
          fi
          
          # Create appdata file
          cat > AppDir/usr/share/metainfo/wine_prefix_manager.appdata.xml << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <component type="desktop-application">
            <id>wine_prefix_manager</id>
            <name>Wine Prefix Manager</name>
            <summary>Manage Wine prefixes on Linux</summary>
            <description>
              <p>A user-friendly tool for managing Wine and Proton prefixes on Linux.</p>
            </description>
            <url type="homepage">https://github.com/jon/wine_prefix_manager</url>
            <launchable type="desktop-id">wine_prefix_manager.desktop</launchable>
            <releases>
              <release version="${{ steps.version.outputs.version }}" date="$(date '+%Y-%m-%d')"/>
            </releases>
          </component>
          EOF

      - name: Build AppImage
        run: |
          # Create symlinks for AppImage
          mkdir -p AppDir/AppRun.d
          ln -s usr/bin/wine_prefix_manager AppDir/AppRun
          ln -s usr/share/icons/hicolor/128x128/apps/wine_prefix_manager.png AppDir/wine_prefix_manager.png
          ln -s usr/share/applications/wine_prefix_manager.desktop AppDir/wine_prefix_manager.desktop
          
          # Build AppImage
          ./linuxdeploy-x86_64.AppImage --appdir=AppDir --output=appimage
          
          # Move AppImage to release directory
          mv Wine_Prefix_Manager-*.AppImage release/wine_prefix_manager-${{ steps.version.outputs.version }}-x86_64.AppImage
          cd release
          sha256sum wine_prefix_manager-${{ steps.version.outputs.version }}-x86_64.AppImage > wine_prefix_manager-${{ steps.version.outputs.version }}-x86_64.AppImage.sha256

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: wine-prefix-manager-appimage
          path: |
            release/*.AppImage
            release/*.AppImage.sha256
          retention-days: 3

  create-release:
    runs-on: ubuntu-latest
    needs: [build-linux, build-deb, build-rpm, build-appimage]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create release directory
        run: mkdir -p release/

      - name: Copy artifacts to release directory
        run: |
          cp artifacts/linux-build/* release/
          cp artifacts/wine-prefix-manager-deb/* release/
          cp artifacts/wine-prefix-manager-rpm/* release/
          cp artifacts/wine-prefix-manager-appimage/* release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release/*.tar.gz
            release/*.tar.gz.sha256
            release/*.deb
            release/*.deb.sha256
            release/*.rpm
            release/*.rpm.sha256
            release/*.AppImage
            release/*.AppImage.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
