name: Version Sync Check

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  version_check:
    name: Check Version Synchronization
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Fetch all history for tags
    
    - name: Set up permissions
      run: chmod +x scripts/check_version_sync.sh
    
    - name: Check version sync
      id: version_check
      run: |
        # Run the version check script
        if ./scripts/check_version_sync.sh; then
          echo "status=synced" >> $GITHUB_OUTPUT
          echo "✅ Versions are in sync"
        else
          exit_code=$?
          if [ $exit_code -eq 1 ]; then
            echo "status=out_of_sync" >> $GITHUB_OUTPUT
            echo "❌ Versions are out of sync"
          else
            echo "status=error" >> $GITHUB_OUTPUT
            echo "💥 Error occurred during version check"
          fi
          exit $exit_code
        fi
    
    - name: Get pubspec version
      id: pubspec_version
      run: |
        version=$(grep "^version:" pubspec.yaml | sed 's/version: *//g' | sed 's/ *#.*//g' | tr -d '"' | tr -d "'")
        echo "version=$version" >> $GITHUB_OUTPUT
        echo "Pubspec version: $version"
    
    - name: Get latest tag
      id: latest_tag
      run: |
        latest_tag=$(git describe --tags --abbrev=0 2>/dev/null || echo "none")
        echo "tag=$latest_tag" >> $GITHUB_OUTPUT
        echo "Latest tag: $latest_tag"
    
    - name: Comment on PR (if out of sync)
      if: github.event_name == 'pull_request' && steps.version_check.outputs.status == 'out_of_sync'
      uses: actions/github-script@v7
      with:
        script: |
          const pubspecVersion = '${{ steps.pubspec_version.outputs.version }}';
          const latestTag = '${{ steps.latest_tag.outputs.tag }}';
          
          const comment = `## ⚠️ Version Synchronization Issue
          
          The version in \`pubspec.yaml\` does not match the latest git tag:
          
          - **Pubspec version:** \`${pubspecVersion}\`
          - **Latest git tag:** \`${latestTag}\`
          
          ### Actions needed:
          1. **Option A:** Update \`pubspec.yaml\` version to match the tag: \`${latestTag.replace(/^v/, '')}\`
          2. **Option B:** Create a new tag for the current version:
             \`\`\`bash
             git tag -a v${pubspecVersion.replace(/\+.*/, '')} -m "Release version ${pubspecVersion.replace(/\+.*/, '')}"
             git push origin v${pubspecVersion.replace(/\+.*/, '')}
             \`\`\`
          
          This check ensures version consistency across your project.`;
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });
    
    - name: Set job summary
      run: |
        pubspec_version="${{ steps.pubspec_version.outputs.version }}"
        latest_tag="${{ steps.latest_tag.outputs.tag }}"
        status="${{ steps.version_check.outputs.status }}"
        
        echo "# Version Sync Check Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
        echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
        echo "| Pubspec Version | \`$pubspec_version\` |" >> $GITHUB_STEP_SUMMARY
        echo "| Latest Git Tag | \`$latest_tag\` |" >> $GITHUB_STEP_SUMMARY
        
        if [ "$status" = "synced" ]; then
          echo "| Status | ✅ **In Sync** |" >> $GITHUB_STEP_SUMMARY
        elif [ "$status" = "out_of_sync" ]; then
          echo "| Status | ❌ **Out of Sync** |" >> $GITHUB_STEP_SUMMARY
        else
          echo "| Status | ⚠️ **Error** |" >> $GITHUB_STEP_SUMMARY
        fi 