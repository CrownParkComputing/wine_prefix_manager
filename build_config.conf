# Wine Prefix Manager Build Configuration
# Edit this file to customize your build and release process

# GitHub repository (format: username/repository-name)
GITHUB_REPO="your-username/wine_prefix_manager"

# Application details
APP_NAME="wine_prefix_manager"
APPIMAGE_NAME="WinePrefixManager"
APP_DISPLAY_NAME="Wine Prefix Manager"

# Build directories
BUILD_DIR="build/linux/x64/release/bundle"
APPIMAGE_DIR="appimage"

# Git settings
DEFAULT_BRANCH="main"

# AppImage settings
APPIMAGE_ICON_PATH="assets/icon.png"  # Path to your app icon (256x256 PNG)
APPIMAGE_CATEGORIES="Utility;System;"

# Release settings
CREATE_DRAFT_RELEASE=false
CREATE_PRERELEASE=false

# Optional: Custom release notes template file
# RELEASE_NOTES_TEMPLATE="release_notes_template.md"

# Dependencies to check (space-separated)
REQUIRED_DEPS="flutter git wget"
OPTIONAL_DEPS="gh convert"  # gh=GitHub CLI, convert=ImageMagick 