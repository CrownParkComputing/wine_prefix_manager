name: wine_prefix_manager
description: A wine prefix manager for Linux gaming
publish_to: 'none'
version: 3.3.1+1748701400

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Cross-platform and Linux dependencies only
  shared_preferences: ^2.5.3
  provider: ^6.0.0
  path: ^1.8.0
  path_provider: ^2.0.0 # Added for logs page
  http: ^1.5.0  # For API requests to GitHub
  dio: ^5.0.0
  process_run: ^1.2.4
  file_selector: ^1.0.0
  window_manager: ^0.5.1 # Updated version
  archive: ^4.0.7  # For tar.gz extraction
  collection: ^1.17.0 # Added for groupBy
  cross_file: ^0.3.4+2
  package_info_plus: ^9.0.0 # Added for version info
  # Use a specific version of bitsdojo_window with Linux fixes # Removed unused bitsdojo_window
  # bitsdojo_window: ^0.1.5
  intl: ^0.20.2
  share_plus: ^12.0.0
  file_saver: ^0.3.1
  url_launcher: ^6.1.14
  flutter_dotenv: ^6.0.0  # For environment variable management
  file_picker: ^10.3.3  # For file selection dialogs
  # ...any other dependencies you need...

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
